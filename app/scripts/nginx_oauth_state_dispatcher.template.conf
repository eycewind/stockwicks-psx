# Template for shared Schwab OAuth callbacks with multiple clients.
#
# Why this exists:
# Schwab can keep one registered callback URL, but nginx must forward the
# callback to the correct client app. The client slug is already present at
# the beginning of the OAuth state value, for example:
#   ashakil:market:3:...
#   ahaitham:trade:3:...
#
# Put the map blocks at the top level of the nginx site include, outside any
# server block. Add one line per client.

map $arg_state $stockwicks_oauth_upstream {
    default 127.0.0.1:8101;
    ~^ashakil(:|%3A) 127.0.0.1:8101;
    ~^CLIENT_SLUG(:|%3A) 127.0.0.1:CLIENT_PORT;
}

map $arg_state $stockwicks_oauth_prefix {
    default "";
    ~^ashakil(:|%3A) /clients/ashakil;
    ~^CLIENT_SLUG(:|%3A) /clients/CLIENT_SLUG;
}

# Replace root callback locations with this pattern on stockwicks.com and
# stonxs.com. Keep the callback URL itself unchanged in Schwab.

location = /auth/callback {
    proxy_pass http://$stockwicks_oauth_upstream/auth/callback$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Host www.stockwicks.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix $stockwicks_oauth_prefix;

    proxy_redirect / $stockwicks_oauth_prefix/;
}

location = /auth/schwab/db/callback {
    proxy_pass http://$stockwicks_oauth_upstream/auth/schwab/db/callback$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Host www.stockwicks.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix $stockwicks_oauth_prefix;

    proxy_redirect / $stockwicks_oauth_prefix/;
}
