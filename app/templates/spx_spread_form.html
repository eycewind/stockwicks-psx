{% extends "base.html" %}
{% block content %}
<h2>SPX Spread Strategy Input</h2>
<form action="/auth/spx-spread-output" method="get">
    <label for="expiry_date">Expiration Date:</label>
    <input type="date" name="expiry_date" required><br><br>

    <label for="current_price">Current SPX Price:</label>
    <input type="number" step="any" name="current_price" required><br><br>

    <button type="submit">🔍 Get Spread Picks</button>
</form>
{% endblock %}
