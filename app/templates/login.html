{% extends "base.html" %}

{% block title %}Login - StockWicks{% endblock %}

{% block content %}
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #0d0d2b;
        color: white;
    }

    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #1a1a40;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    .login-container h2 {
        color: white;
        margin-bottom: 20px;
    }

    .login-container input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        background-color: #23235b;
        color: white;
        margin-bottom: 15px;
    }

    .login-container input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .login-container button {
        background-color: #f16d0f;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }

    .login-container button:hover {
        background-color: #ff784e;
        transform: scale(1.05);
    }

    .login-container a {
        display: block;
        color: #f16d0f;
        text-decoration: none;
        margin-top: 10px;
        font-size: 14px;
    }

    .login-container a:hover {
        text-decoration: underline;
    }

</style>

<div class="container">
    <div class="login-container">
        <h2>Login to StockWicks</h2>

        {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form action="" method="post">
            <input type="hidden" name="next" value="{{ request.query_params.get('next', '') }}">
            <input class="form-control" type="text" id="username" name="username" placeholder="Username" required>
            <input class="form-control" type="password" id="password" name="password" placeholder="Password" required>

            <button class="btn" type="submit">Login</button>

            <a href="register">Don't have an account? Register</a>
            <a href="{{ request.url_for('recover_password_page') }}">Forgot Password?</a>
            <a href="{{ request.url_for('recover_username_page') }}">Forgot Username?</a>  <!-- ✅ Added this link -->

        </form>
    </div>
</div>

{% endblock %}
