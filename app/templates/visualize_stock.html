<!-- app/templates/visualize_stock.html -->
{% extends "base.html" %}

{% block title %}Stock Visualization - {{ symbol }}{% endblock %}

{% block content %}
    <h2>Stock Visualization for {{ symbol }}</h2>
    {{ div|safe }}
    <script>{{ script|safe }}</script>
{% endblock %}

{% block extra_js %}
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-2.4.2.min.js"></script>
{% endblock %}

{% block extra_css %}
    <link href="https://cdn.bokeh.org/bokeh/release/bokeh-2.4.2.min.css" rel="stylesheet" type="text/css">
{% endblock %}
