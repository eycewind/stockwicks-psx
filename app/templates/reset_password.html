{% extends "base.html" %}

{% block title %}Reset Password - StockWicks{% endblock %}

{% block content %}
<style>
      body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #0d0d2b;
    }
    .reset-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #1a1a40;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    .reset-container h2 {
        color: white;
        margin-bottom: 20px;
    }

    .reset-container input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        background-color: #23235b;
        color: white;
        margin-bottom: 15px;
    }

    .reset-container input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .reset-container button {
        background-color: #f16d0f;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }

    .reset-container button:hover {
        background-color: #ff784e;
        transform: scale(1.05);
    }

    .reset-container a {
        display: block;
        color: #f16d0f;
        text-decoration: none;
        margin-top: 10px;
        font-size: 14px;
    }

    .reset-container a:hover {
        text-decoration: underline;
    }
    
</style>

<div class="container">
    <div class="reset-container">
        <h2>Reset Your Password</h2>

        {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form action="" method="post">
            <input class="form-control" type="hidden" name="token" value="{{ token }}">
            
            <input class="form-control" type="password" id="password" name="password" placeholder="Enter new password" required>
            
            <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
        
            <button class="btn" type="submit">Reset Password</button>
            
            <a href="login">Back to Login</a>
        </form>
        
    </div>
</div>

{% endblock %}
