{% extends "base.html" %}

{% block title %}Recover Password - StockWicks{% endblock %}

{% block content %}
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #0d0d2b;
        color: white;
    }

    .recover-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #1a1a40;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    .recover-container h2 {
        color: white;
        margin-bottom: 20px;
    }

    .recover-container input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        background-color: #23235b;
        color: white;
        margin-bottom: 15px;
    }

    .recover-container input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .recover-container button {
        background-color: #f16d0f;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }

    .recover-container button:hover {
        background-color: #ff784e;
        transform: scale(1.05);
    }

    .recover-container a {
        display: block;
        color: #f16d0f;
        text-decoration: none;
        margin-top: 10px;
        font-size: 14px;
    }

    .recover-container a:hover {
        text-decoration: underline;
    }
</style>

<div class="container">
    <div class="recover-container">
        <h2>Recover Password</h2>

        <form action="{{ request.url_for('recover_password') }}" method="post">
            <input class="form-control" type="email" id="email" name="email" placeholder="Enter your email" required>
            <button class="btn" type="submit">Recover Password</button>
            <a href="{{ request.url_for('login') }}">Back to Login</a>
        </form>
    </div>
</div>

{% endblock %}
