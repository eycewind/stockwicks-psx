name: Deploy Ashakil

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile tracked Python files
        run: |
          git ls-files '*.py' | xargs python -m py_compile

      - name: Package release
        run: |
          mkdir -p release
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'deploy' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'venv' \
            --exclude 'data' \
            --exclude 'logs' \
            ./ release/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release and scripts
        run: |
          RELEASE_ID="${GITHUB_SHA::8}-$(date +%Y%m%d%H%M%S)"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /tmp/stockwicks-ashakil-${RELEASE_ID}"

          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            release/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/stockwicks-ashakil-${RELEASE_ID}/"

          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/stockwicks-ashakil-${RELEASE_ID}-deploy/"

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod +x /tmp/stockwicks-ashakil-${RELEASE_ID}-deploy/deploy_ashakil.sh && \
             ASHAKIL_APP_PATH='${{ secrets.ASHAKIL_APP_PATH }}' \
             RELEASE_SRC=/tmp/stockwicks-ashakil-${RELEASE_ID} \
             bash /tmp/stockwicks-ashakil-${RELEASE_ID}-deploy/deploy_ashakil.sh"

      - name: Health check
        run: |
          curl -fsS --max-time 20 "${{ secrets.ASHAKIL_PUBLIC_URL }}"