name: Rollback Rollout

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated client slugs to roll back"
        required: false
        default: "haithama yzia"
      restart:
        description: "Restart target web/celery/beat services"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Preview restore only"
        required: true
        type: boolean
        default: true

jobs:
  rollback-rollout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload rollback script
        run: |
          RELEASE_ID="rollback-rollout-${GITHUB_SHA::8}-$(date +%Y%m%d%H%M%S)"
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /tmp/stockwicks-${RELEASE_ID}-deploy"

          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            app/scripts/rollback_rollout.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/stockwicks-${RELEASE_ID}-deploy/rollback_rollout.sh"

      - name: Roll back target clients
        run: |
          APPLY_FLAG="--apply"
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            APPLY_FLAG=""
          fi

          RESTART_FLAG=""
          if [[ "${{ github.event.inputs.restart }}" == "true" && "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            RESTART_FLAG="--restart"
          fi

          RUNNER="bash"
          if [[ -n "${RESTART_FLAG}" ]]; then
            RUNNER="sudo bash"
          fi

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod +x /tmp/stockwicks-${RELEASE_ID}-deploy/rollback_rollout.sh && \
             ${RUNNER} /tmp/stockwicks-${RELEASE_ID}-deploy/rollback_rollout.sh \
               ${APPLY_FLAG} ${RESTART_FLAG} ${{ github.event.inputs.targets }}"
